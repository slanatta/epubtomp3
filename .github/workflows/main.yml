name: Build Windows installer

# Runs on Microsoft's Windows machines, so nothing has to be installed locally.
#
# Start it from the Actions tab (Run workflow), or push a tag like v1.0.0 to
# get a downloadable Release as well as a build artifact.

on:
  # Click "Run workflow" on the Actions tab whenever you want a build.
  workflow_dispatch:
  # Pushing a version tag also publishes a shareable Release.
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Make Python use UTF-8 everywhere. Windows otherwise defaults to a legacy
  # code page, which turns any non-Latin character in a log line into a crash.
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify the speech engine imports
        run: |
          python -c "import kokoro_onnx, onnxruntime, lameenc, mutagen, espeakng_loader, tkinter; print('imports ok')"

      - name: Run the test suite
        run: python tests/test_units.py

      - name: Build the executable
        run: |
          pyinstaller build/epub2mp3.spec --noconfirm --clean --distpath dist --workpath .buildwork

      - name: Confirm the executable exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path 'dist/EpubToMP3/EpubToMP3.exe')) {
            Write-Host '::error::PyInstaller finished but EpubToMP3.exe is missing.'
            exit 1
          }
          # -File matters: directories have no Length, and measuring them raises
          # an error that GitHub's strict mode would turn into a failed step.
          $bytes = (Get-ChildItem -Recurse -File 'dist/EpubToMP3' |
                    Measure-Object -Property Length -Sum).Sum
          Write-Host ('Built folder: {0:N0} MB' -f ($bytes / 1MB))
          exit 0

      # Smoke test: run the FINISHED executable against a generated book. This
      # is the check that would have caught a bundle missing its data files.
      - name: Smoke-test the frozen build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $book = Join-Path $env:RUNNER_TEMP 'smoke.epub'
          python tests/make_epub.py "$book"
          $out = & 'dist\EpubToMP3\EpubToMP3-cli.exe' "$book" --list-chapters | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            Write-Host "::error::The frozen program exited with code $code."
            exit 1
          }
          if ($out -notmatch 'Chapter One') {
            Write-Host '::error::The frozen program could not read the test book.'
            exit 1
          }
          Write-Host 'Frozen build reads EPUBs correctly.'
          exit 0

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup is not on this image, installing it...'
            choco install innosetup --no-progress -y | Out-Host
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Host '::error::Could not find or install Inno Setup.'
            exit 1
          }
          Write-Host "Using: $iscc"
          # Log the compiler version so we know which directives it supports.
          # ISCC returns a nonzero code when printing usage, and GitHub checks
          # $LASTEXITCODE at the end of every pwsh step - hence the explicit
          # exit 0 below, or this diagnostic alone would fail the build.
          (Get-Item $iscc).VersionInfo.ProductVersion |
            ForEach-Object { Write-Host "Inno Setup version: $_" }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & '${{ steps.inno.outputs.iscc }}' /Q 'build\installer.iss'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Inno Setup failed with code $LASTEXITCODE."
            exit 1
          }
          Get-ChildItem 'dist\*Setup.exe' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ('{0}  ({1:N0} MB)' -f $_.Name, ($_.Length / 1MB)) }
          exit 0

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: EpubToMP3-Setup
          path: dist/*Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload the portable folder
        uses: actions/upload-artifact@v4
        with:
          name: EpubToMP3-portable
          path: dist/EpubToMP3/
          if-no-files-found: error
          retention-days: 90

      # Tag pushes additionally produce a permanent, shareable download link.
      - name: Publish a Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*Setup.exe
          generate_release_notes: true
          body: |
            Windows installer for EPUB to MP3.

            Download the Setup.exe below and run it. Windows SmartScreen will
            warn on first launch because the program is not code-signed —
            click "More info" then "Run anyway".

            The first time the program starts it downloads a 330 MB voice
            model. Everything after that works offline.
