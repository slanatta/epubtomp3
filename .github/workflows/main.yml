name: Build Windows installer

# Runs on Microsoft's Windows machines, so nothing has to be installed locally.
#
# Start it from the Actions tab (Run workflow), or push a tag like v1.0.0 to
# get a downloadable Release as well as a build artifact.

on:
  # Click "Run workflow" on the Actions tab whenever you want a build.
  workflow_dispatch:
  # Pushing a version tag also publishes a shareable Release.
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify the speech engine imports
        run: |
          python -c "import kokoro_onnx, onnxruntime, lameenc, mutagen, espeakng_loader, tkinter; print('imports ok')"

      - name: Run the test suite
        run: python tests/test_units.py

      - name: Build the executable
        run: |
          pyinstaller build/epub2mp3.spec --noconfirm --clean --distpath dist --workpath .buildwork

      - name: Confirm the executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/EpubToMP3/EpubToMP3.exe")) {
            Write-Error "PyInstaller finished but EpubToMP3.exe is missing."
            exit 1
          }
          $size = (Get-ChildItem -Recurse "dist/EpubToMP3" | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Built folder is {0:N0} MB" -f $size)

      # Smoke test: the frozen build must be able to read an EPUB and list its
      # chapters. This runs the real executable, not the source.
      - name: Smoke-test the frozen build
        shell: pwsh
        run: |
          python tests/make_epub.py "$env:RUNNER_TEMP\smoke.epub"
          $out = & "dist\EpubToMP3\EpubToMP3-cli.exe" "$env:RUNNER_TEMP\smoke.epub" --list-chapters 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Error "The frozen CLI exited with $LASTEXITCODE"; exit 1 }
          if ($out -notmatch "Chapter One") {
            Write-Error "The frozen build could not parse the test book."
            exit 1
          }
          Write-Host "Frozen build reads EPUBs correctly."

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not on the image, installing it..."
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "Could not find or install Inno Setup."; exit 1 }
          Write-Host "Using $iscc"
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.iscc }}" /Q "build\installer.iss"
          Get-ChildItem "dist\*Setup.exe" | ForEach-Object {
            Write-Host ("{0}  ({1:N0} MB)" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: EpubToMP3-Setup
          path: dist/*Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload the portable folder
        uses: actions/upload-artifact@v4
        with:
          name: EpubToMP3-portable
          path: dist/EpubToMP3/
          if-no-files-found: error
          retention-days: 90

      # Tag pushes additionally produce a permanent, shareable download link.
      - name: Publish a Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*Setup.exe
          generate_release_notes: true
          body: |
            Windows installer for EPUB to MP3.

            Download the Setup.exe below and run it. Windows SmartScreen will
            warn on first launch because the program is not code-signed —
            click "More info" then "Run anyway".

            The first time the program starts it downloads a 330 MB voice
            model. Everything after that works offline.
